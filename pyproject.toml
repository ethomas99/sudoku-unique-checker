[project]
name = "sudoku-unique"
version = "0.1.0"
description = "Check whether a Sudoku board has exactly one solution"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ethomas99" }]

[project.scripts]
sudoku-unique = "sudoku_unique.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
